[project]
name = "langgraph-learning-path"
version = "0.1.0"
description = "A step-by-step LangGraph learning path, in English and Spanish: from the first graph to a multi-agent deep research system."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "ddgs>=9.16.0",
    "ipython>=9.17.1",
    "langchain-openai>=1.6.6",
    "langgraph>=1.2.12",
    "pydantic>=2.0",
    "python-dotenv>=1.2.3",
    "typesafe-sdk>=0.7.2",
]
